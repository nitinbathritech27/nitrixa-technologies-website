
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Internship Certificates | NITRIXA</title>

  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f5f7fb;
      --text: #172033;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    .page {
      max-width: 1000px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 34px); }
    h2 { margin-top: 0; }
    p { line-height: 1.6; }
    .muted { color: var(--muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 15px;
      border-radius: 9px;
      background: var(--primary);
      color: white;
      border: 1px solid var(--primary);
      text-decoration: none;
      font-weight: 650;
      font-size: 14px;
      cursor: pointer;
    }

    .btn.secondary {
      color: var(--text);
      background: white;
      border-color: var(--border);
    }

    .notice {
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 20px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .notice.info { background: #eef2ff; color: #3730a3; }
    .notice.success { background: #f0fdf4; color: #166534; }
    .notice.error { background: #fef2f2; color: #991b1b; }

    .certificate-list { display: grid; gap: 20px; }

    .certificate-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 24px;
      box-shadow: 0 3px 12px rgb(15 23 42 / 4%);
    }

    .certificate-design {
      border: 2px solid #c7d2fe;
      border-radius: 12px;
      padding: 28px 20px;
      text-align: center;
      background: linear-gradient(145deg, #ffffff, #f5f7ff);
    }

    .brand {
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 22px;
    }

    .certificate-design h2 {
      color: #1e293b;
      font-size: clamp(25px, 5vw, 38px);
      margin-bottom: 12px;
    }

    .certificate-subtitle {
      font-size: 15px;
      color: var(--muted);
    }

    .certificate-number {
      margin: 18px 0;
      padding: 11px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .detail {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .detail span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .detail strong { font-size: 14px; }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #dcfce7;
      color: #166534;
    }

    .status.revoked {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .empty {
      padding: 35px 20px;
      background: white;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      text-align: center;
      line-height: 1.6;
    }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .page { padding: 20px 12px 35px; }
      .certificate-card { padding: 14px; }
      .certificate-design { padding: 23px 12px; }
      .details { grid-template-columns: 1fr; }
    }

    @media print {
      body { background: white; }
      .page { max-width: 100%; padding: 0; }
      .header, #pageNotice, .actions, .page-intro { display: none !important; }
      .certificate-list { display: block; }
      .certificate-card {
        box-shadow: none;
        border: none;
        padding: 0;
        break-inside: avoid;
      }
      .certificate-design {
        min-height: 500px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .details { text-align: left; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>My Internship Certificates</h1>
        <p class="muted page-intro">
          View your final internship certificate and verify its authenticity.
        </p>
      </div>

      <a class="btn secondary" href="../intern-dashboard.html">
        Back to Dashboard
      </a>
    </header>

    <div id="pageNotice" class="notice info" role="status" aria-live="polite">
      Loading your certificates...
    </div>

    <section id="certificateList" class="certificate-list">
      <div class="empty">Please wait while we load your certificates.</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

  <script>
    (() => {
      "use strict";

      const $ = id => document.getElementById(id);

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function formatDate(value) {
        if (!value) return "Not available";

        const date = new Date(value);
        return Number.isNaN(date.getTime())
          ? "Not available"
          : date.toLocaleDateString(undefined, {
              year: "numeric",
              month: "long",
              day: "numeric"
            });
      }

      function showNotice(message, type = "info") {
        const notice = $("pageNotice");
        notice.className = "notice " + type;
        notice.textContent = message;
      }

      async function loadCertificates() {
        const db = window.supabaseClient;

        if (!db) {
          throw new Error(
            "Supabase client was not initialized. Please check ../js/supabase.js."
          );
        }

        const { data: sessionData, error: sessionError } =
          await db.auth.getSession();

        if (sessionError) throw sessionError;

        const user = sessionData?.session?.user;

        if (!user) {
          window.location.href = "../login.html";
          return;
        }

        // Only fetch enrollments belonging to the signed-in user.
        const { data: enrollments, error: enrollmentError } = await db
          .from("enrollments")
          .select("id,program_id")
          .eq("user_id", user.id);

        if (enrollmentError) throw enrollmentError;

        const enrollmentRows = enrollments || [];
        const enrollmentIds = enrollmentRows.map(row => row.id);

        if (!enrollmentIds.length) {
          $("certificateList").innerHTML = `
            <div class="empty">
              <h2>No internship enrollment found</h2>
              <p>Your certificate will appear here when it is issued for your internship.</p>
            </div>`;
          showNotice("No internship enrollments were found for your account.");
          return;
        }

        const { data: certificates, error: certificateError } = await db
          .from("internship_certificates")
          .select("id,enrollment_id,certificate_number,verification_token,status,issued_at,revoked_at,revocation_reason")
          .in("enrollment_id", enrollmentIds)
          .order("issued_at", { ascending: false });

        if (certificateError) throw certificateError;

        const programIds = [...new Set(
          enrollmentRows.map(row => row.program_id).filter(Boolean)
        )];

        let programs = [];

        if (programIds.length) {
          const { data, error } = await db
            .from("programs")
            .select("id,name")
            .in("id", programIds);

          if (error) throw error;
          programs = data || [];
        }

        const programName = enrollmentId => {
          const enrollment = enrollmentRows.find(row => row.id === enrollmentId);
          const program = programs.find(row => row.id === enrollment?.program_id);
          return program?.name || "Internship Program";
        };

        const rows = certificates || [];

        if (!rows.length) {
          $("certificateList").innerHTML = `
            <div class="empty">
              <h2>No final certificate issued yet</h2>
              <p>
                Your final internship certificate will appear here after the
                administrator approves your final evaluation and internship completion.
              </p>
            </div>`;

          showNotice("Your enrollment was found, but no final internship certificate has been issued yet.");
          return;
        }

        $("certificateList").innerHTML = rows.map(certificate => {
          const revoked = certificate.status === "REVOKED";
          const verificationUrl =
            "../verify-certificate.html?token=" +
            encodeURIComponent(certificate.verification_token);

          return `
            <article class="certificate-card">
              <div class="certificate-design">
                <div class="brand">NITRIXA TECHNOLOGIES</div>

                <h2>Internship Certificate</h2>

                <p class="certificate-subtitle">
                  This certificate records the issuance of a final internship certificate.
                </p>

                <h3>${escapeHtml(programName(certificate.enrollment_id))}</h3>

                <p class="certificate-subtitle">
                  Certificate Number
                </p>

                <div class="certificate-number">
                  ${escapeHtml(certificate.certificate_number)}
                </div>

                <div>
                  <span class="status ${revoked ? "revoked" : ""}">
                    ${revoked ? "REVOKED" : "VALID"}
                  </span>
                </div>

                <p class="certificate-subtitle" style="margin-top:20px">
                  Issued on ${escapeHtml(formatDate(certificate.issued_at))}
                </p>
              </div>

              <div class="details">
                <div class="detail">
                  <span>Certificate Number</span>
                  <strong>${escapeHtml(certificate.certificate_number)}</strong>
                </div>

                <div class="detail">
                  <span>Issue Date</span>
                  <strong>${escapeHtml(formatDate(certificate.issued_at))}</strong>
                </div>

                <div class="detail">
                  <span>Certificate Status</span>
                  <strong>${revoked ? "Revoked" : "Valid"}</strong>
                </div>

                ${revoked ? `
                  <div class="detail">
                    <span>Revocation Reason</span>
                    <strong>${escapeHtml(certificate.revocation_reason || "Contact support for details")}</strong>
                  </div>` : ""}
              </div>

              <div class="actions">
                <button type="button" class="btn" data-print>
                  Print / Save as PDF
                </button>

                <a class="btn secondary"
                   href="${escapeHtml(verificationUrl)}"
                   target="_blank" rel="noopener noreferrer">
                  Verify Certificate
                </a>
              </div>

              ${revoked ? `
                <p class="muted">
                  This certificate has been revoked and should not be presented as valid.
                  Contact NITRIXA Technologies if you need assistance.
                </p>` : ""}
            </article>`;
        }).join("");

        showNotice(
          "Your certificate records have loaded successfully.",
          "success"
        );
      }

      document.addEventListener("click", event => {
        if (event.target.closest("[data-print]")) {
          window.print();
        }
      });

      loadCertificates().catch(error => {
        console.error(error);
        showNotice(
          error.message || "Unable to load your certificates. Please try again.",
          "error"
        );

        $("certificateList").innerHTML = `
          <div class="empty">
            <h2>Unable to load certificates</h2>
            <p>Please refresh the page. If the issue continues, contact support.</p>
          </div>`;
      });
    })();
  </script>
</body>
</html>
