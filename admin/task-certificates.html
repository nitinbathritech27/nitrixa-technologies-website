<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Task Certificates | Admin</title>
  <link rel="stylesheet" href="../css/global.css">

  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f5f7fb;
      --border: #e2e8f0;
      --text: #172033;
      --muted: #64748b;
      --green: #166534;
      --red: #991b1b;
      --amber: #92400e;
    }

    * { box-sizing: border-box; }

    body {

      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;

    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>Task Certificates</h1>
        <p class="muted">
          Upload a shared certificate image and publish it for interns whose task is approved.
        </p>
      </div>

      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <a class="btn secondary" href="tasks.html">Task Management</a>
        <a class="btn secondary" href="task-review.html">Task Review</a>
        <button class="btn" id="refreshBtn" type="button">Refresh</button>
      </div>
    </header>

    <div id="alert" class="alert info" role="status">Checking admin access…</div>

    <section class="summary">
      <div class="summary-card">
        <span>Tasks</span>
        <strong id="totalTasks">—</strong>
      </div>
      <div class="summary-card">
        <span>Approved assignments</span>
        <strong id="approvedTotal">—</strong>
      </div>
      <div class="summary-card">
        <span>Published certificates</span>
        <strong id="publishedTotal">—</strong>
      </div>
    </section>

    <section class="filters">
      <input id="searchInput" type="search" placeholder="Search task title…" aria-label="Search tasks">
      <select id="certificateFilter" aria-label="Filter tasks">
        <option value="ALL">All tasks</option>
        <option value="APPROVED">Has approved interns</option>
        <option value="PUBLISHED">Has published certificates</option>
        <option value="UNPUBLISHED">Not currently published</option>
      </select>
    </section>

    <section id="certificateList" class="certificate-list" aria-live="polite">
      <div class="loading">Loading certificate records…</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

  <script>
    (() => {
      "use strict";

      const BUCKET = "task-certificates";
      const MAX_IMAGE_SIZE = 5 * 1024 * 1024;
      const ALLOWED_TYPES = ["image/png", "image/jpeg", "image/webp"];

      const state = {
        db: null,
        user: null,
        projects: [],
        assignments: [],
        certificates: [],
        busyProjects: new Set()
      };

      const $ = id => document.getElementById(id);

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, ch => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[ch]);
      }

      function showAlert(message, type = "info") {
        $("alert").className = "alert " + type;
        $("alert").textContent = message;
        $("alert").classList.remove("hidden");
      }

      function formatDate(value) {
        if (!value) return "—";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "—" : date.toLocaleString();
      }

      async function checkAdmin() {
        state.db = window.supabaseClient;

        if (!state.db) {
          throw new Error("Supabase client was not initialized. Check ../js/supabase.js.");
        }

        const { data, error } = await state.db.auth.getSession();
        if (error) throw error;

        if (!data?.session?.user) {
          window.location.href = "../login.html";
          return false;
        }

        state.user = data.session.user;

        const { data: isAdmin, error: adminError } =
          await state.db.rpc("is_admin");

        if (adminError) throw adminError;

        if (isAdmin !== true) {
          showAlert("Access denied. Only authorized administrators can manage certificates.", "error");
          $("certificateList").innerHTML = "";
          return false;
        }

        return true;
      }

      async function loadData() {
        const db = state.db;

        $("certificateList").innerHTML =
          '<div class="loading">Loading tasks and certificate records…</div>';

        const [projectsResult, assignmentsResult, certificatesResult] =
          await Promise.all([
            db.from("projects")
              .select("id,title,status,created_at")
              .order("created_at", { ascending: false }),

            db.from("project_assignments")
              .select("id,project_id,status,enrollment_id")
              .eq("status", "APPROVED"),

            db.from("project_certificates")
              .select("id,assignment_id,image_url,published,published_at,updated_at")
          ]);

        if (projectsResult.error) throw projectsResult.error;
        if (assignmentsResult.error) throw assignmentsResult.error;
        if (certificatesResult.error) throw certificatesResult.error;

        state.projects = projectsResult.data || [];
        state.assignments = assignmentsResult.data || [];
        state.certificates = certificatesResult.data || [];

        updateSummary();
        await renderCards();
        $("alert").classList.add("hidden");
      }

      function updateSummary() {
        $("totalTasks").textContent = state.projects.length;
        $("approvedTotal").textContent = state.assignments.length;
        $("publishedTotal").textContent =
          state.certificates.filter(c => c.published).length;
      }

      function recordsForProject(projectId) {
        const approvedAssignments = state.assignments.filter(
          a => a.project_id === projectId
        );

        const assignmentIds = new Set(approvedAssignments.map(a => a.id));

        const certificates = state.certificates.filter(
          c => assignmentIds.has(c.assignment_id)
        );

        const publishedCount = certificates.filter(c => c.published).length;

        const paths = certificates
          .filter(c => c.published && c.image_url)
          .map(c => c.image_url);

        const commonPath = paths.length ? paths[0] : null;

        return {
          approvedAssignments,
          certificates,
          publishedCount,
          commonPath
        };
      }

      async function getPreviewUrl(path) {
        if (!path) return null;

        const { data, error } = await state.db.storage
          .from(BUCKET)
          .createSignedUrl(path, 900);

        if (error) {
          console.warn("Certificate preview unavailable:", error.message);
          return null;
        }

        return data?.signedUrl || null;
      }

      async function renderCard(project) {
        const info = recordsForProject(project.id);
        const busy = state.busyProjects.has(project.id);
        const published = info.publishedCount > 0;
        const previewUrl = await getPreviewUrl(info.commonPath);

        const previewHtml = previewUrl ? `
          <div class="preview">
            <img
              src="${escapeHtml(previewUrl)}"
              alt="Published certificate preview"
              loading="lazy"
            >
            <p class="help">Preview link expires after 15 minutes.</p>
          </div>
        ` : info.commonPath ? `
          <div class="preview">
            <p class="help">A published image exists, but its preview could not be loaded.</p>
          </div>
        ` : "";

        return `
          <article class="certificate-card" data-project-card
            data-title="${escapeHtml(project.title || "")}"
            data-approved="${info.approvedAssignments.length}"
            data-published="${published ? "YES" : "NO"}">

            <div class="card-header">
              <div>
                <h2>${escapeHtml(project.title || "Untitled task")}</h2>
                <div class="meta">
                  <span>Task status: ${escapeHtml(project.status || "UNKNOWN")}</span>
                  <span>Approved interns: ${info.approvedAssignments.length}</span>
                  <span>Published certificates: ${info.publishedCount}</span>
                </div>
              </div>

              <span class="badge ${published ? "success" : "warning"}">
                ${published ? "Published" : "Not published"}
              </span>
            </div>

            <section class="section">
              <h3>Upload shared certificate image</h3>
              <p class="help">
                Accepted formats: PNG, JPG/JPEG, WebP. Maximum file size: 5 MB.
                The same image will be used for every approved assignment for this task.
              </p>

              <form class="certificate-form" data-certificate-form
                data-project-id="${escapeHtml(project.id)}">

                <div class="field">
                  <label for="image-${escapeHtml(project.id)}">Certificate image</label>
                  <input
                    id="image-${escapeHtml(project.id)}"
                    name="certificate_image"
                    type="file"
                    accept="image/png,image/jpeg,image/webp"
                    ${busy || !info.approvedAssignments.length ? "disabled" : ""}
                    ${!published ? "required" : ""}
                  >
                  <span class="help">
                    ${info.approvedAssignments.length
                      ? "Uploading a new image and publishing it will replace the currently published image for this task."
                      : "No approved interns yet. Approve an assignment before publishing certificates."}
                  </span>
                </div>

                <button class="btn" type="submit"
                  ${busy || !info.approvedAssignments.length ? "disabled" : ""}>
                  ${busy ? "Processing…" : published ? "Upload & republish" : "Upload & publish"}
                </button>
              </form>

              ${previewHtml}

              <div class="actions">
                ${published ? `
                  <button
                    class="btn danger"
                    type="button"
                    data-unpublish="${escapeHtml(project.id)}"
                    ${busy ? "disabled" : ""}>
                    Unpublish certificates
                  </button>
                ` : ""}

                <span class="help">
                  ${published
                    ? "Published certificates are visible only to their approved owners."
                    : "Publishing creates certificates only for currently approved assignments."}
                </span>
              </div>
            </section>
          </article>
        `;
      }

      async function renderCards() {
        const search = $("searchInput").value.trim().toLowerCase();
        const filter = $("certificateFilter").value;

        const filtered = state.projects.filter(project => {
          const info = recordsForProject(project.id);
          const matchesSearch = !search ||
            String(project.title || "").toLowerCase().includes(search);

          let matchesFilter = true;

          if (filter === "APPROVED") {
            matchesFilter = info.approvedAssignments.length > 0;
          } else if (filter === "PUBLISHED") {
            matchesFilter = info.publishedCount > 0;
          } else if (filter === "UNPUBLISHED") {
            matchesFilter = info.publishedCount === 0;
          }

          return matchesSearch && matchesFilter;
        });

        if (!filtered.length) {
          $("certificateList").innerHTML = `
            <div class="empty">
              No tasks match this filter.
              <br>Try another filter or refresh the page.
            </div>`;
          return;
        }

        $("certificateList").innerHTML =
          '<div class="loading">Preparing certificate management cards…</div>';

        const cards = [];

        for (const project of filtered) {
          cards.push(await renderCard(project));
        }

        $("certificateList").innerHTML = cards.join("");
      }

      function fileExtension(file) {
        const parts = String(file.name || "").split(".");
        const ext = parts.length > 1 ? parts.pop().toLowerCase() : "";

        if (file.type === "image/png" && ext === "png") return "png";
        if (file.type === "image/webp" && ext === "webp") return "webp";
        if (file.type === "image/jpeg" && ["jpg", "jpeg"].includes(ext)) return ext;

        if (file.type === "image/png") return "png";
        if (file.type === "image/webp") return "webp";
        if (file.type === "image/jpeg") return "jpg";

        throw new Error("Only PNG, JPG/JPEG and WebP images are supported.");
      }

      async function uploadAndPublish(form) {
        const projectId = form.dataset.projectId;

        if (state.busyProjects.has(projectId)) return;

        const project = state.projects.find(p => p.id === projectId);
        if (!project) throw new Error("Task not found. Refresh and try again.");

        const info = recordsForProject(projectId);

        if (!info.approvedAssignments.length) {
          throw new Error("There are no approved assignments for this task.");
        }

        const file = form.elements.namedItem("certificate_image").files?.[0];

        if (!file) {
          throw new Error("Choose a certificate image first.");
        }

        if (!ALLOWED_TYPES.includes(file.type)) {
          throw new Error("Choose a PNG, JPG/JPEG or WebP image.");
        }

        if (file.size <= 0 || file.size > MAX_IMAGE_SIZE) {
          throw new Error("The image must be greater than 0 bytes and no larger than 5 MB.");
        }

        const ext = fileExtension(file);
        const path = `${projectId}/${crypto.randomUUID()}.${ext}`;

        if (!window.confirm(
          `Publish this certificate image for ${info.approvedAssignments.length} approved assignment(s) in "${project.title}"?`
        )) {
          return;
        }

        state.busyProjects.add(projectId);
        showAlert("Uploading certificate image and publishing…", "info");
        await renderCards();

        let uploadedPath = null;

        try {
          const { data: uploadData, error: uploadError } =
            await state.db.storage
              .from(BUCKET)
              .upload(path, file, {
                cacheControl: "3600",
                upsert: false,
                contentType: file.type
              });

          if (uploadError) throw uploadError;

          uploadedPath = uploadData?.path || path;

          const { data, error } = await state.db.rpc(
            "admin_publish_task_certificate",
            {
              p_project_id: projectId,
              p_image_path: uploadedPath,
              p_published: true
            }
          );

          if (error) throw error;

          if (!data || data.success !== true) {
            throw new Error("The database did not confirm certificate publication.");
          }

          showAlert(
            `Certificate published for ${data.eligible_approved_assignments} approved assignment(s).`,
            "success"
          );

          await loadData();
        } catch (error) {
          if (uploadedPath) {
            try {
              await state.db.storage.from(BUCKET).remove([uploadedPath]);
            } catch (_) {
              // Keep the original publication error.
            }
          }

          throw error;
        } finally {
          state.busyProjects.delete(projectId);
        }
      }

      async function unpublishProject(projectId) {
        const project = state.projects.find(p => p.id === projectId);
        if (!project) throw new Error("Task not found.");

        if (state.busyProjects.has(projectId)) return;

        const info = recordsForProject(projectId);

        if (!info.publishedCount) {
          throw new Error("No published certificates were found for this task.");
        }

        if (!window.confirm(
          `Unpublish certificates for "${project.title}"? Interns will no longer be able to access them.`
        )) {
          return;
        }

        state.busyProjects.add(projectId);
        showAlert("Unpublishing certificates…", "info");
        await renderCards();

        try {
          const { data, error } = await state.db.rpc(
            "admin_publish_task_certificate",
            {
              p_project_id: projectId,
              p_image_path: null,
              p_published: false
            }
          );

          if (error) throw error;

          if (!data || data.success !== true) {
            throw new Error("The database did not confirm unpublishing.");
          }

          showAlert(
            `Certificates unpublished for ${data.eligible_approved_assignments} approved assignment(s).`,
            "success"
          );

          await loadData();
        } finally {
          state.busyProjects.delete(projectId);
        }
      }

      function bindEvents() {
        $("refreshBtn").addEventListener("click", async () => {
          $("refreshBtn").disabled = true;

          try {
            await loadData();
            showAlert("Certificate records refreshed.", "success");
          } catch (error) {
            showAlert(error.message || "Could not refresh certificate records.", "error");
          } finally {
            $("refreshBtn").disabled = false;
          }
        });

        $("searchInput").addEventListener("input", () => {
          renderCards().catch(error => showAlert(error.message, "error"));
        });

        $("certificateFilter").addEventListener("change", () => {
          renderCards().catch(error => showAlert(error.message, "error"));
        });

        $("certificateList").addEventListener("submit", async event => {
          const form = event.target.closest("[data-certificate-form]");
          if (!form) return;

          event.preventDefault();

          try {
            await uploadAndPublish(form);
          } catch (error) {
            showAlert(error.message || "Certificate publication failed.", "error");
            await renderCards();
          }
        });

        $("certificateList").addEventListener("click", async event => {
          const button = event.target.closest("[data-unpublish]");
          if (!button) return;

          button.disabled = true;

          try {
            await unpublishProject(button.dataset.unpublish);
          } catch (error) {
            showAlert(error.message || "Could not unpublish certificates.", "error");
            await renderCards();
          }
        });
      }

      async function init() {
        bindEvents();

        try {
          const allowed = await checkAdmin();
          if (!allowed) return;

          await loadData();
        } catch (error) {
          console.error("Certificate management initialization failed:", error);

          $("certificateList").innerHTML = `
            <div class="empty">
              Unable to load certificate management.
              <br>${escapeHtml(error.message || "Please try again.")}
            </div>`;

          showAlert(error.message || "Could not initialize certificate management.", "error");
        }
      }

      document.addEventListener("DOMContentLoaded", init);
    })();
  </script>
</body>
</html>
